name: V3 HTTPS preview

on:
  push:
    branches: [preview/v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breakwind-v3-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/preview/v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:integrity
      - run: npm audit --audit-level=high
      - run: node scripts/export-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .expo/pages-preview

  deploy:
    if: github.ref == 'refs/heads/preview/v3'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
